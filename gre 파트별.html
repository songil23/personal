<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFAF8">
<title>파트별 단어장</title>
<style>
  :root{
    --paper:#FAFAF8; --card:#FFFFFF; --ink:#17181C; --ink-2:#5A5D66; --ink-3:#8E9199;
    --rule:#E4E4DE; --accent:#3D4EDB; --mark:#FFE9A8; --veil:#F1F1EC;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --ipa:"Charis SIL","Doulos SIL","Gentium Plus","Lucida Sans Unicode","Segoe UI",var(--sans);
  }
  @media (prefers-color-scheme: dark){
    :root{--paper:#121317;--card:#1A1C21;--ink:#EDEDEA;--ink-2:#A6A9B2;--ink-3:#71747C;
      --rule:#2C2F36;--accent:#93A0FF;--mark:#5A4A18;--veil:#23262C;}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:16px;font-weight:350;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:0 18px}

  header{position:sticky;top:0;z-index:20;
    background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);
    border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top);
    transition:transform .25s ease}
  header.hidden{transform:translateY(-100%)}

  .controls{display:flex;gap:8px;padding:12px 0;align-items:center}
  .search{flex:1 1 auto;position:relative;display:flex;align-items:center;background:var(--card);
    border:1px solid var(--rule);border-radius:11px;height:38px;padding:0 12px;gap:8px}
  .search:focus-within{border-color:var(--accent)}
  .search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);
    font-family:var(--mono);font-size:16px;min-width:0}
  .search input::placeholder{color:var(--ink-3)}
  .clear{border:0;background:transparent;color:var(--ink-3);font-size:18px;width:28px;height:28px;
    border-radius:50%;cursor:pointer;display:none}
  .clear.on{display:block}

  .seg{flex:0 0 auto;display:flex;background:var(--card);border:1px solid var(--rule);border-radius:11px;height:38px;overflow:hidden}
  .seg button{border:0;background:transparent;color:var(--ink-2);font-family:var(--sans);
    font-size:14px;font-weight:550;padding:0 12px;height:100%;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .meta{display:flex;align-items:center;gap:8px;padding:10px 0 12px;
    font-family:var(--mono);font-size:12px;color:var(--ink-3)}
  .meta .grow{flex:1}
  .pill{border:1px solid var(--rule);background:var(--card);color:var(--ink-2);border-radius:999px;
    padding:6px 12px;font-family:var(--mono);font-size:12px;cursor:pointer;min-height:32px}
  .dotfilter{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--rule);
    background:var(--card);border-radius:999px;padding:7px 12px;cursor:pointer;min-height:32px}
  .dotfilter[aria-pressed="true"]{border-color:#E5484D}
  .dotfilter .fdot{width:8px;height:8px;border-radius:50%;border:1.3px solid var(--ink-3);background:transparent}
  .dotfilter .fdot.on{background:#E5484D;border-color:#E5484D}
  select.pill{appearance:none;-webkit-appearance:none;padding-right:26px;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),
      linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
    background-position:calc(100% - 15px) 14px, calc(100% - 11px) 14px;
    background-size:4px 4px, 4px 4px;background-repeat:no-repeat}

  /* ---------- 구분선 ---------- */
  .partdiv{font-family:var(--serif);font-size:19px;color:var(--ink);letter-spacing:-.01em;
    padding:26px 0 4px}
  .chdiv{font-family:var(--mono);font-size:12px;color:var(--ink-3);letter-spacing:.02em;
    padding:16px 0 6px;border-bottom:1px solid var(--rule)}

  /* ---------- 행 ---------- */
  .row{border-bottom:1px solid var(--rule);padding:16px 0}
  .row-main{display:flex;gap:8px;align-items:flex-start}
  .num{flex:0 0 auto;min-width:1.9em;text-align:left;padding-top:8px;
    font-family:var(--mono);font-size:11px;color:var(--ink-3);
    font-variant-numeric:tabular-nums;user-select:none}
  .left{flex:1 1 auto;min-width:0}

  .marks{display:inline-flex;gap:4px;align-items:center;margin-bottom:3px;line-height:1}
  .mark-dot{width:9px;height:9px;border-radius:50%;
    border:1.3px solid var(--ink-3);background:transparent;padding:0;cursor:pointer;
    transition:background .1s,border-color .1s}
  .mark-dot:active{transform:scale(.85)}
  .mark-dot.filled{background:#E5484D;border-color:#E5484D}
  .mark-plus{width:26px;height:16px;margin-left:5px;padding:0;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    border:1px solid var(--rule);border-radius:5px;background:var(--card);
    color:var(--ink-3);font-family:var(--sans);font-size:13px;line-height:1;text-align:center}
  .mark-plus:active{transform:scale(.9)}

  .w{font-family:var(--serif);font-weight:350;font-size:22px;letter-spacing:-.01em;
    line-height:1.25;word-break:break-word;margin:0}
  .w mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
  .wline{display:flex;align-items:center;gap:9px}
  .speak{flex:0 0 auto;width:28px;height:26px;padding:0;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    border:1px solid var(--rule);border-radius:7px;background:var(--card);color:var(--ink-2)}
  .speak svg{width:14px;height:14px;fill:currentColor}
  .speak:active{transform:scale(.9)}
  .speak.playing{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  #cardSpeak{width:44px;height:30px;border-radius:9px;margin-top:14px}
  #cardSpeak svg{width:16px;height:16px}

  /* 발음 기호: 단어 바로 아래 */
  .p{font-family:var(--ipa);font-size:14px;color:var(--ink-3);margin-top:4px;
    line-height:1.5;word-break:break-word;letter-spacing:.01em}

  #sentinel{height:60px;display:flex;align-items:center;justify-content:center;
    color:var(--ink-3);font-family:var(--mono);font-size:12px}
  .empty{padding:64px 0;text-align:center;color:var(--ink-3)}
  .empty .big{font-family:var(--serif);font-size:22px;color:var(--ink-2);margin-bottom:6px}

  #cardView{display:none;padding:8px 0 24px}
  #cardView.on{display:block}
  #listView.off{display:none}
  .card{background:var(--card);border:1px solid var(--rule);border-radius:20px;min-height:52vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 22px;text-align:center;box-shadow:0 1px 0 var(--rule)}
  .card .cw{font-family:var(--serif);font-weight:350;font-size:40px;line-height:1.15;letter-spacing:-.02em;word-break:break-word}
  .card .cp{font-family:var(--ipa);font-size:16px;color:var(--ink-3);margin-top:12px;line-height:1.5}
  .cardmarks{margin-top:26px}
  .cardmarks .mark-dot{width:14px;height:14px}
  .cardmarks .mark-plus{width:32px;height:20px;font-size:15px}
  .nav{display:flex;gap:10px;margin-top:16px;align-items:center}
  .nav button{flex:1;height:52px;border-radius:14px;border:1px solid var(--rule);background:var(--card);
    color:var(--ink);font-family:var(--sans);font-size:15px;font-weight:550;cursor:pointer}
  .nav button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .pos-ind{text-align:center;font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-top:14px}
  footer{padding:28px 0 calc(28px + env(safe-area-inset-bottom));text-align:center;
    color:var(--ink-3);font-family:var(--mono);font-size:11px}
  @keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<header id="hdr">
  <div class="wrap">
    <div class="controls">
      <label class="search">
        <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="검색" aria-label="검색">
        <button class="clear" id="clear" aria-label="검색어 지우기">×</button>
      </label>
      <div class="seg" role="group" aria-label="보기 방식">
        <button id="tabList" aria-pressed="true">목록</button>
        <button id="tabCard" aria-pressed="false">카드</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="meta">
    <span id="resultCount"></span>
    <span class="grow"></span>
    <button class="dotfilter" id="levelFilter" aria-pressed="false" aria-label="표시 단계로 거르기">
      <span class="fdot"></span><span class="fdot"></span><span class="fdot"></span><span class="fdot"></span><span class="fdot"></span>
    </button>
    <select class="pill" id="part" aria-label="파트 선택"></select>
  </div>

  <section id="listView">
    <div id="list"></div>
    <div id="sentinel"></div>
  </section>

  <section id="cardView">
    <div class="card" id="card">
      <div class="cw" id="cardWord"></div>
      <div class="cp" id="cardPron"></div>
      <button class="speak" id="cardSpeak" aria-label="발음 듣기"></button>
      <div class="cardmarks" id="cardMarks"></div>
    </div>
    <div class="nav">
      <button id="prev">← 이전</button>
      <button id="shuffle">섞기</button>
      <button id="next" class="primary">다음 →</button>
    </div>
    <div class="pos-ind" id="posInd"></div>
  </section>
  <footer>2,393 words · 파트별</footer>
</main>

<script id="meta" type="application/json">{"parts":[{"p":1,"label":"33~13번 출제된 115단어","count":114},{"p":2,"label":"12~10번 출제된 115단어","count":115},{"p":3,"label":"10~8번 출제된 115단어","count":114},{"p":4,"label":"8~7번 출제된 115단어","count":115},{"p":5,"label":"7~6번 출제된 115단어","count":115},{"p":6,"label":"6번 출제된 115단어","count":115},{"p":7,"label":"6~5번 출제된 115단어","count":115},{"p":8,"label":"5~4번 출제된 115단어","count":116},{"p":9,"label":"4번 출제된 115단어","count":115},{"p":10,"label":"4~3번 출제된 115단어","count":115},{"p":11,"label":"3번 출제된 115단어","count":115},{"p":12,"label":"3번 출제된 115단어","count":115},{"p":13,"label":"2번 출제된 116단어","count":116},{"p":14,"label":"2번 출제된 116단어","count":116},{"p":15,"label":"2~1번 출제된 117단어","count":117},{"p":16,"label":"1번 출제된 118단어","count":118},{"p":17,"label":"1번 출제된 118단어","count":118},{"p":18,"label":"24~11번 출제된 108단어","count":108},{"p":19,"label":"11~7번 출제된 108단어","count":108},{"p":20,"label":"7~5번 출제된 107단어","count":107},{"p":21,"label":"5~4번 출제된 106단어","count":106}],"chapters":{"1":{"1":"Chapter 01 (obscure ~ loathe)","2":"Chapter 02 (opaque ~ novel)","3":"Chapter 03 (obviate ~ vacillate)"},"2":{"4":"Chapter 04 (adulate ~ flout)","5":"Chapter 05 (galvanize ~ arbitrary)","6":"Chapter 06 (articulate ~ quotidian)"},"3":{"7":"Chapter 07 (salubrious ~ deficient)","8":"Chapter 08 (deride ~ plausible)","9":"Chapter 09 (presumptuous ~ condemn)"},"4":{"10":"Chapter 10 (contemptuous ~ imprudent)","11":"Chapter 11 (indefatigable ~ subvert)","12":"Chapter 12 (surfeit ~ crucial)"},"5":{"13":"Chapter 13 (debase ~ impugn)","14":"Chapter 14 (inchoate ~ rational)","15":"Chapter 15 (rebuff ~ betray)"},"6":{"16":"Chapter 16 (bewilder ~ evoke)","17":"Chapter 17 (exasperate ~ negligent)","18":"Chapter 18 (novice ~ staggering)"},"7":{"19":"Chapter 19 (startling ~ arduous)","20":"Chapter 20 (aristocratic ~ daunt)","21":"Chapter 21 (debunk ~ grandiose)"},"8":{"22":"Chapter 22 (hidebound ~ nettle)","23":"Chapter 23 (obliterate ~ scintillate)","24":"Chapter 24 (secluded ~ agreeable)"},"9":{"25":"Chapter 25 (ahistorical ~ calumniate)","26":"Chapter 26 (canard ~ drastically)","27":"Chapter 27 (egocentric ~ incipient)"},"10":{"28":"Chapter 28 (industrious ~ prone)","29":"Chapter 29 (propitious ~ trenchant)","30":"Chapter 30 (truncate ~ approbation)"},"11":{"31":"Chapter 31 (arbitrate ~ decimate)","32":"Chapter 32 (decode ~ exact)","33":"Chapter 33 (excavate ~ ignoble)"},"12":{"34":"Chapter 34 (immerse ~ needy)","35":"Chapter 35 (negate ~ sedate)","36":"Chapter 36 (seduce ~ zenith)"},"13":{"37":"Chapter 37 (abject ~ cavil)","38":"Chapter 38 (chaste ~ dispensable)","39":"Chapter 39 (dispose ~ gawky)"},"14":{"40":"Chapter 40 (glut ~ laudable)","41":"Chapter 41 (lighthearted ~ plucky)","42":"Chapter 42 (plummet ~ snobbery)"},"15":{"43":"Chapter 43 (squander ~ wholehearted)","44":"Chapter 44 (willful ~ cachet)","45":"Chapter 45 (captious ~ disarmed)"},"16":{"46":"Chapter 46 (disencumber ~ formidable)","47":"Chapter 47 (fraught with ~ jibe)","48":"Chapter 48 (jolt ~ overblown)"},"17":{"49":"Chapter 49 (overload ~ raucous)","50":"Chapter 50 (recalibrate ~ supple)","51":"Chapter 51 (supplication ~ wield)"},"18":{"52":"Chapter 52 (sophisticated ~ verify)","53":"Chapter 53 (adequate ~ rigid)","54":"Chapter 54 (skepticism ~ feasible)"},"19":{"55":"Chapter 55 (flourish ~ substantial)","56":"Chapter 56 (suspect ~ barren)","57":"Chapter 57 (colleague ~ concise)"},"20":{"58":"Chapter 58 (curative ~ vague)","59":"Chapter 59 (abandon ~ unconscious)","60":"Chapter 60 (undiminished ~ impact)"},"21":{"61":"Chapter 61 (mishandle ~ impose)","62":"Chapter 62 (incessant ~ misconception)","63":"Chapter 63 (multiply ~ undeservedly)"}}}</script>
<script>
(function(){
  "use strict";
  var WORDS = JSON.parse(document.getElementById('payload').textContent);
  var META  = JSON.parse(document.getElementById('meta').textContent);
  var PARTS = META.parts;      // [{p,label,count}]
  var CH    = META.chapters;   // {p:{c:title}}
  WORDS.forEach(function(o,i){ o.i = i; o.key = o.w.toLowerCase(); });

  function esc(s){ return s.replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  // 발음 기호: 원본과 동일하게 대괄호만 씌운다
  function pronHTML(o){ return o.ipa ? '[' + esc(o.ipa) + ']' : ''; }

  // 발음: 브라우저 내장 음성(TTS)으로 읽어 준다 (원본 gre 단어.html과 동일, 오프라인 지원)
  var SPK_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1c2.9.9 5 3.5 5 6.7s-2.1 5.8-5 6.7v2.1c4-.9 7-4.5 7-8.8s-3-7.9-7-8.8z"/></svg>';
  var canSpeak = 'speechSynthesis' in window;
  var preferredVoice = null;
  function pickVoice(){
    if (!canSpeak) return;
    var voices = window.speechSynthesis.getVoices();
    if (!voices.length) return;
    var en = voices.filter(function(v){ return /^en(-|_|$)/i.test(v.lang); });
    var femaleNames = /(female|samantha|karen|moira|tessa|victoria|susan|zoe|serena|fiona|allison|ava|kate|nicky)/i;
    var female = en.filter(function(v){ return femaleNames.test(v.name); });
    preferredVoice = (female[0] || en[0] || null);
  }
  if (canSpeak){ pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(word, btn){
    if (!canSpeak) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(word);
      u.lang = 'en-US';
      u.rate = 0.9;
      if (preferredVoice) u.voice = preferredVoice;
      if (btn){ btn.classList.add('playing'); u.onend = u.onerror = function(){ btn.classList.remove('playing'); }; }
      window.speechSynthesis.speak(u);
    } catch (e){}
  }

  var view='list', partFilter=1, query='', filterLevel=0;
  var results = WORDS.slice(), shown = 0, STEP = 60, cardIdx = 0;
  function $(id){ return document.getElementById(id); }
  var MAXLV = 5;

  var STORE_KEY = 'gre-part-level-v1';
  var levels = (function(){
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
    catch (e){ return {}; }
  })();
  function saveLevels(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(levels)); } catch (e){} }
  function levelOf(o){ return levels[o.w] || 0; }
  function setLevel(o, lv){ if (lv <= 0) delete levels[o.w]; else levels[o.w] = lv; saveLevels(); }

  var list = $('list'), sentinel = $('sentinel'), card = $('card');

  var partCount = {};
  PARTS.forEach(function(p){ partCount[p.p] = p.count; });
  function setPartLabels(withCount){
    var sel = $('part');
    for (var i = 0; i < sel.options.length; i++){
      var opt = sel.options[i], v = opt.value;
      if (v === '0'){ opt.text = '전체'; continue; }
      opt.text = withCount ? '파트 ' + v + ' (' + partCount[v] + ')' : '파트 ' + v;
    }
  }
  (function(){
    var sel = $('part'), html = '<option value="0">전체</option>';
    PARTS.forEach(function(p){ html += '<option value="' + p.p + '">파트 ' + p.p + '</option>'; });
    sel.innerHTML = html; sel.value = '1';
  })();

  function highlight(w){
    var q = query.trim();
    if (!q) return esc(w);
    var i = w.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return esc(w);
    return esc(w.slice(0,i)) + '<mark>' + esc(w.slice(i, i+q.length)) + '</mark>' + esc(w.slice(i+q.length));
  }

  function marksHTML(o){
    var lv = levelOf(o), h = '<span class="marks" role="group" aria-label="표시 단계">';
    for (var i = 1; i <= MAXLV; i++){
      h += '<button class="mark-dot' + (i <= lv ? ' filled' : '') + '" data-lv="' + i + '" aria-label="' + i + '단계"></button>';
    }
    h += '<button class="mark-plus" data-plus="1" aria-label="단계 올리기">+</button>';
    return h + '</span>';
  }

  function wireMarks(marks, o, extra){
    function syncDots(lv){
      var dots = marks.querySelectorAll('.mark-dot');
      for (var i = 0; i < dots.length; i++) dots[i].classList.toggle('filled', (i + 1) <= lv);
    }
    marks.addEventListener('click', function(e){
      var plus = e.target.closest('.mark-plus');
      var btn = e.target.closest('.mark-dot');
      if (!plus && !btn) return;
      e.stopPropagation();
      var lv;
      if (plus){ lv = (levelOf(o) + 1) % (MAXLV + 1); }
      else { var c = parseInt(btn.getAttribute('data-lv'), 10); lv = (levelOf(o) === c) ? c - 1 : c; }
      setLevel(o, lv);
      syncDots(lv);
      if (extra) extra(lv);
      if (filterLevel && lv < filterLevel) applyFilter();
    });
  }

  function buildRow(o){
    var row = document.createElement('article');
    row.className = 'row';
    row.innerHTML =
      '<div class="row-main">' +
        '<span class="num">' + o.n + '</span>' +
        '<div class="left">' +
          marksHTML(o) +
          '<div class="wline"><h2 class="w">' + highlight(o.w) + '</h2>' +
            (canSpeak ? '<button class="speak" aria-label="발음 듣기">' + SPK_ICON + '</button>' : '') +
          '</div>' +
          (function(){ var ph = pronHTML(o); return ph ? '<div class="p">' + ph + '</div>' : ''; })() +
        '</div>' +
      '</div>';
    wireMarks(row.querySelector('.marks'), o);
    var spk = row.querySelector('.speak');
    if (spk) spk.addEventListener('click', function(e){ e.stopPropagation(); speak(o.w, spk); });
    return row;
  }

  var lastPart = null, lastCh = null;
  function dividerFor(o){
    var frag = document.createDocumentFragment();
    if (partFilter === 0 && o.p !== lastPart){
      var pd = document.createElement('div'); pd.className = 'partdiv';
      var meta = PARTS[o.p - 1];
      pd.textContent = '파트 ' + o.p + (meta && meta.label ? ' · ' + meta.label : '');
      frag.appendChild(pd); lastPart = o.p; lastCh = null;
    }
    if (o.c !== lastCh){
      var cd = document.createElement('div'); cd.className = 'chdiv';
      cd.textContent = (CH[o.p] && CH[o.p][o.c]) || ('Chapter ' + o.c);
      frag.appendChild(cd); lastCh = o.c;
    }
    return frag;
  }

  function more(){
    var frag = document.createDocumentFragment();
    var end = Math.min(shown + STEP, results.length);
    for (var i = shown; i < end; i++){
      var o = results[i];
      frag.appendChild(dividerFor(o));
      frag.appendChild(buildRow(o));
    }
    list.appendChild(frag);
    shown = end;
    sentinel.textContent = shown < results.length ? '내려서 더 보기' : '끝';
  }

  function applyFilter(){
    var q = query.trim().toLowerCase();
    results = WORDS.filter(function(o){
      if (partFilter && o.p !== partFilter) return false;
      if (filterLevel && levelOf(o) < filterLevel) return false;
      return q ? o.key.indexOf(q) > -1 : true;
    });
    var label = partFilter ? '파트 ' + partFilter : '전체 ' + WORDS.length.toLocaleString() + '단어';
    $('resultCount').textContent = q ? label + ' · ' + results.length.toLocaleString() + '개 찾음' : label;
    shown = 0; list.innerHTML = ''; lastPart = null; lastCh = null;
    if (!results.length){
      var msg = filterLevel ? '표시한 단어가 없어요' : '찾는 단어가 없어요';
      var sub = filterLevel ? '단어 위의 점을 눌러 단계를 매겨 보세요.' : '다른 파트를 고르거나 다른 단어로 검색해 보세요.';
      list.innerHTML = '<div class="empty"><div class="big">' + msg + '</div><div>' + sub + '</div></div>';
      sentinel.textContent = '';
    } else { more(); }
    cardIdx = 0; renderCard();
  }

  new IntersectionObserver(function(en){
    if (en[0].isIntersecting && shown < results.length && view === 'list') more();
  }, {rootMargin:'400px'}).observe(sentinel);

  (function(){ var cs = $('cardSpeak'); if (canSpeak) cs.innerHTML = SPK_ICON; else cs.style.display = 'none'; })();
  function renderCard(){
    if (!results.length){ $('cardWord').textContent = '—'; $('cardPron').innerHTML = ''; $('cardMarks').innerHTML = ''; $('posInd').textContent = ''; return; }
    if (cardIdx >= results.length) cardIdx = 0;
    if (cardIdx < 0) cardIdx = results.length - 1;
    var o = results[cardIdx];
    $('cardWord').textContent = o.w;
    $('cardPron').innerHTML = pronHTML(o);
    $('cardMarks').innerHTML = marksHTML(o);
    wireMarks($('cardMarks').querySelector('.marks'), o);
    if (canSpeak){ var cs = $('cardSpeak'); cs.classList.remove('playing'); cs.onclick = function(e){ e.stopPropagation(); speak(o.w, cs); }; }
    $('posInd').textContent = '파트 ' + o.p + ' · ' + (cardIdx + 1) + ' / ' + results.length;
  }
  $('next').addEventListener('click', function(){ cardIdx++; renderCard(); window.scrollTo({top:0}); });
  $('prev').addEventListener('click', function(){ cardIdx--; renderCard(); window.scrollTo({top:0}); });
  $('shuffle').addEventListener('click', function(){
    for (var i = results.length - 1; i > 0; i--){
      var j = Math.floor(Math.random()*(i+1)), t = results[i]; results[i] = results[j]; results[j] = t;
    }
    cardIdx = 0; renderCard();
    if (view === 'list'){ shown = 0; list.innerHTML = ''; lastPart = null; lastCh = null; more(); }
  });

  var sx = 0, sy = 0;
  card.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  card.addEventListener('touchend', function(e){
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5){ cardIdx += dx < 0 ? 1 : -1; renderCard(); }
  }, {passive:true});

  var timer;
  $('q').addEventListener('input', function(e){
    var v = e.target.value;
    $('clear').classList.toggle('on', v.length > 0);
    clearTimeout(timer);
    timer = setTimeout(function(){ query = v; applyFilter(); }, 160);
  });
  $('clear').addEventListener('click', function(){
    $('q').value = ''; query = ''; this.classList.remove('on'); applyFilter();
  });
  $('part').addEventListener('change', function(){
    partFilter = parseInt(this.value, 10);
    setPartLabels(false);
    applyFilter();
    window.scrollTo({top:0});
  });
  $('part').addEventListener('focus', function(){ setPartLabels(true); });
  $('part').addEventListener('blur', function(){ setPartLabels(false); });
  $('part').addEventListener('mousedown', function(){ setPartLabels(true); });

  $('levelFilter').addEventListener('click', function(){
    filterLevel = (filterLevel + 1) % (MAXLV + 1);
    this.setAttribute('aria-pressed', filterLevel > 0);
    var dots = this.querySelectorAll('.fdot');
    for (var i = 0; i < dots.length; i++) dots[i].classList.toggle('on', (i + 1) <= filterLevel);
    applyFilter();
    window.scrollTo({top:0});
  });

  function setView(v){
    view = v;
    $('tabList').setAttribute('aria-pressed', v === 'list');
    $('tabCard').setAttribute('aria-pressed', v === 'card');
    $('listView').classList.toggle('off', v !== 'list');
    $('cardView').classList.toggle('on', v === 'card');
    window.scrollTo({top:0});
  }
  $('tabList').addEventListener('click', function(){ setView('list'); });
  $('tabCard').addEventListener('click', function(){ setView('card'); });
  document.addEventListener('keydown', function(e){
    if (view !== 'card' || /input/i.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight'){ cardIdx++; renderCard(); }
    if (e.key === 'ArrowLeft'){ cardIdx--; renderCard(); }
  });

  (function(){
    var hdr = document.getElementById('hdr'), lastY = 0, ticking = false;
    function onScroll(){
      var y = window.pageYOffset || document.documentElement.scrollTop;
      if (y > lastY && y > 80) hdr.classList.add('hidden');
      else hdr.classList.remove('hidden');
      lastY = y < 0 ? 0 : y;
      ticking = false;
    }
    window.addEventListener('scroll', function(){
      if (!ticking){ window.requestAnimationFrame(onScroll); ticking = true; }
    }, {passive:true});
  })();

  setPartLabels(false);
  applyFilter();
})();
</script>
</body>
